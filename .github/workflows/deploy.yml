name: Deploy Laravel to SharedHost

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # ---------------------------------------------------------
      # Deploy application
      # ---------------------------------------------------------
      - name: Deploy via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}

          # Change this if your FTP account does not start
          # directly inside the Laravel application directory.
          server-dir: /

          dangerous-clean-slate: false

          exclude: |
            **/.git/**
            **/.git*
            **/.github/**
            **/.github*
            **/node_modules/**
            **/tests/**
            **/.env
            **/.env.*
            **/.gitignore
            **/.gitattributes
            **/.DS_Store
            **/.vscode/**
            **/.kilo/**
            **/deploy.sh
            **/deploy-exclude.txt
