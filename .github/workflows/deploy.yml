name: Deploy Laravel to SharedHost

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: mbstring, xml, ctype, iconv, mysql, zip
          coverage: none

      # ---------------------------------------------------------
      # Deploy application
      # ---------------------------------------------------------
      - name: Deploy via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}

          # Change this if your FTP account does not start
          # directly inside the Laravel application directory.
          server-dir: /

          dangerous-clean-slate: false

          exclude: |
            **/.git/**
            **/.git*
            **/.github/**
            **/.github*
            **/node_modules/**
            **/tests/**
            **/.env
            **/.env.*
            **/storage/framework/cache/**
            **/storage/framework/sessions/**
            **/storage/framework/testing/**
            **/storage/logs/**
            **/.gitignore
            **/.gitattributes
            **/.DS_Store
            **/.vscode/**
            **/.kilo/**
            **/deploy.sh
            **/deploy-exclude.txt

      # ---------------------------------------------------------
      # Clear Laravel view cache
      # ---------------------------------------------------------
      - name: Clear Laravel view cache
        env:
          DEPLOY_URL: ${{ vars.DEPLOY_URL || 'https://oasis-rpm.afriscribe.org' }}
        run: |
          FTP_ENDPOINT="${{ secrets.FTP_SERVER }}"
          DEPLOY_URL="${DEPLOY_URL%/}"

          case "$FTP_ENDPOINT" in
            ftp://*|ftps://*) ;;
            *) FTP_ENDPOINT="ftp://$FTP_ENDPOINT" ;;
          esac

          cat > clear-view-cache.php <<'PHP'
          <?php

          require __DIR__ . '/vendor/autoload.php';

          $app = require_once __DIR__ . '/bootstrap/app.php';

          $kernel = $app->make(
              Illuminate\Contracts\Console\Kernel::class
          );

          $kernel->call('view:clear');

          echo "View cache cleared\n";
          PHP

          curl --fail --silent --show-error \
            -u "${{ secrets.FTP_USERNAME }}:${{ secrets.FTP_PASSWORD }}" \
            -T clear-view-cache.php \
            "$FTP_ENDPOINT/clear-view-cache.php"

          curl --fail --silent --show-error \
            "$DEPLOY_URL/clear-view-cache.php"

          curl --fail --silent --show-error \
            -u "${{ secrets.FTP_USERNAME }}:${{ secrets.FTP_PASSWORD }}" \
            -X DELETE \
            "$FTP_ENDPOINT/clear-view-cache.php"

          rm -f clear-view-cache.php