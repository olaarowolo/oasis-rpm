name: Deploy Laravel to SharedHost

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: mbstring, xml, ctype, iconv, mysql, zip
          coverage: none

      - name: Verify Composer lockfile exists
        run: |
          test -f composer.lock || {
            echo "composer.lock is required for deployment. Commit the lockfile and push again." >&2
            exit 1
          }

      - name: Prepare Laravel writable directories
        run: |
          mkdir -p bootstrap/cache \
            storage/framework/cache \
            storage/framework/sessions \
            storage/framework/testing \
            storage/logs
          chmod -R u+rwX bootstrap/cache storage

      - name: Install Composer dependencies
        run: |
          composer install \
            --prefer-dist \
            --no-dev \
            --no-progress \
            --optimize-autoloader

      # ---------------------------------------------------------
      # Deploy application
      # ---------------------------------------------------------
      - name: Deploy via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}

          # Change this if your FTP account does not start
          # directly inside the Laravel application directory.
          server-dir: /

          dangerous-clean-slate: false

          exclude: |
            **/.git/**
            **/.git*
            **/.github/**
            **/.github*
            **/node_modules/**
            **/tests/**
            **/.env
            **/.env.*
            **/storage/framework/cache/**
            **/storage/framework/sessions/**
            **/storage/framework/testing/**
            **/storage/logs/**
            **/.gitignore
            **/.gitattributes
            **/.DS_Store
            **/.vscode/**
            **/.kilo/**
            **/deploy.sh
            **/deploy-exclude.txt
